<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>torabo-tsuki LP — Keymap Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111820;
      --panel: #18222d;
      --key: #22303c;
      --key-hover: #2b3d4c;
      --border: #344554;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #67e8f9;
      --accent-bg: #164e63;
      --layer-key-bg: #203b47;
      --layer-key-border: #0e7490;
      --layer-key-text: #e5e7eb;
      --code-bg: #0f1720;
      --unit: clamp(48px, 5vw, 72px);
      --gap: clamp(5px, .5vw, 8px);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef4f7;
      --panel: #ffffff;
      --key: #f8fafc;
      --key-hover: #e8f5f8;
      --border: #b8c8d2;
      --text: #17212b;
      --muted: #5d7180;
      --accent: #08758a;
      --accent-bg: #d8f4f8;
      --layer-key-bg: #dbeafe;
      --layer-key-border: #2563eb;
      --layer-key-text: #1e3a8a;
      --code-bg: #e7eef2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 211, 238, .07), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: clamp(20px, 4vw, 56px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0 0 5px;
      font-size: clamp(22px, 2.4vw, 34px);
      letter-spacing: -.03em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 14px;
      background: var(--panel);
      color: var(--muted);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: .15s ease;
    }

    button:hover { color: var(--text); border-color: #527086; }
    button[aria-selected="true"] { color: var(--accent); background: var(--accent-bg); border-color: #0e7490; }

    .theme-toggle {
      min-width: 44px;
      padding-inline: 11px;
      color: var(--text);
    }

    .github-link {
      display: grid;
      width: 44px;
      height: 38px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      transition: .15s ease;
    }

    .github-link:hover { border-color: #527086; color: var(--accent); }
    .github-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .github-link svg { width: 20px; height: 20px; fill: currentColor; }

    .viewport {
      overflow-x: auto;
      padding: 3px 3px 22px;
    }

    .keyboard {
      min-width: calc(var(--unit) * 14 + var(--gap) * 13 + clamp(70px, 7vw, 110px) + 36px);
      display: grid;
      gap: var(--gap);
    }

    .axis-row,
    .row-shell {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 6px;
    }

    .axis-corner,
    .row-label,
    .col-label {
      display: grid;
      place-items: center;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      opacity: .72;
    }

    .axis-corner {
      width: 30px;
      height: 22px;
      border-right: 1px solid rgba(103, 232, 249, .2);
      border-bottom: 1px solid rgba(103, 232, 249, .2);
    }

    .row-label {
      border-right: 1px solid rgba(103, 232, 249, .2);
    }

    .column-headers {
      height: 22px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(7, var(--unit)) minmax(70px, 1fr) repeat(7, var(--unit));
      gap: var(--gap);
    }

    .row.short {
      grid-template-columns: repeat(6, var(--unit)) calc(var(--unit) + var(--gap)) minmax(70px, 1fr) calc(var(--unit) + var(--gap)) repeat(6, var(--unit));
    }

    .row.short .split { grid-column: 10; }

    .key {
      position: relative;
      height: var(--unit);
      padding: 8px 6px 6px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 7px;
      background: var(--key);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .25);
      text-align: center;
      transition: .15s ease;
      cursor: pointer;
    }

    .key:hover { transform: translateY(-2px); background: var(--key-hover); border-color: var(--border); }
    .key:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .key:active { transform: translateY(1px); }
    .key.transparent { opacity: .46; }
    .key.layer-key {
      border-color: var(--layer-key-border);
      background: var(--layer-key-bg);
      color: var(--layer-key-text);
    }
    .key.layer-key .action { color: var(--layer-key-text); opacity: .72; }

    .key-hole {
      height: var(--unit);
      border: 1px dashed rgba(148, 163, 184, .14);
      border-radius: 7px;
      background: rgba(15, 23, 42, .2);
    }

    .action {
      position: absolute;
      top: 5px;
      left: 6px;
      max-width: calc(100% - 12px);
      overflow: hidden;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9px;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .label {
      display: grid;
      height: 100%;
      place-items: center;
      padding-top: 7px;
      font-size: clamp(13px, 1.45vw, 21px);
      white-space: nowrap;
    }

    .label.small { font-size: clamp(9px, .82vw, 12px); }

    .split { grid-column: 9; }

    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 5px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--key);
    }

    .dot.layer { border-color: #0e7490; background: #203b47; }

    .settings {
      margin-top: 28px;
      padding: clamp(16px, 2.5vw, 26px);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .settings h2 {
      margin: 0;
      font-size: 18px;
    }

    .settings-status {
      margin: 5px 0 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .setting {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
    }

    .setting dt {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .setting dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .setting code { background: var(--code-bg); }

    .copy-toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      padding: 10px 14px;
      border: 1px solid var(--layer-key-border);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .15s ease, transform .15s ease;
    }

    .copy-toast.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 700px) {
      header { align-items: start; flex-direction: column; }
      .tabs { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="title">layer_0</h1>
        <p id="status" class="subtitle">config/keymap.keymap を読み込んでいます…</p>
      </div>
      <div class="header-actions">
        <nav class="tabs" aria-label="レイヤー選択"></nav>
        <a class="github-link" href="https://github.com/marcotech-jp/zmk-keyboard-torabo-tsuki-lp" target="_blank" rel="noopener noreferrer" aria-label="GitHubでリポジトリを開く" title="GitHubリポジトリ">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.74-1.55-2.57-.29-5.28-1.29-5.28-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18A10.95 10.95 0 0 1 12 6.15c.98 0 1.95.13 2.88.38 2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.4-2.71 5.38-5.29 5.67.42.36.79 1.06.79 2.14v3.25c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
          </svg>
        </a>
        <button class="theme-toggle" type="button" aria-label="ライトモードに切り替え" title="テーマ切替">☀︎</button>
      </div>
    </header>

    <div class="viewport">
      <section class="keyboard" aria-label="キーマップ"></section>
    </div>

    <footer>
      <span><i class="dot"></i>通常キー</span>
      <span><i class="dot layer"></i>長押し・レイヤー切替などの特殊キー</span>
      <span>▽ = 下位レイヤーの設定を継承</span>
      <span>キーをクリック = layer・row・colをコピー</span>
    </footer>

    <section class="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">ポインティング設定</h2>
      <p id="settings-status" class="settings-status">マウス関連の設定ファイルを読み込んでいます…</p>
      <dl class="settings-grid"></dl>
    </section>
  </main>
  <div class="copy-toast" role="status" aria-live="polite"></div>

  <script>
    const KEYMAP_URL = "config/keymap.keymap";
    const POINTING_CONFIG_URLS = {
      build: "build.yaml",
      shield: "boards/shields/torabo_tsuki_lp/torabo_tsuki_lp_right.overlay",
      device: "snippets/input-trackball/input-trackball.overlay",
      driver: "snippets/input-trackball/input-trackball.conf"
    };
    const ROW_LENGTHS = [12, 12, 14, 12];
    const KEY_LABELS = {
      ESCAPE: "ESC", LCTRL: "CTRL", LSHFT: "⇧", RSHFT: "⇧", RIGHT_SHIFT: "⇧",
      LGUI: "◆", LALT: "LALT", LANGUAGE_2: "英数", LANGUAGE_1: "日本語",
      COMMA: ",", DOT: ".", FSLH: "/", SPACE: "␠", BSPC: "⌫", ENTER: "↵",
      LEFT: "←", RIGHT: "→", DOWN: "↓", UP: "↑", UP_ARROW: "↑",
      PG_UP: "PG↑", PAGE_DOWN: "PG↓", DELETE: "DEL", SINGLE_QUOTE: "'", SQT: ":",
      DQT: "\"", GRAVE: "`", TILDE: "~", PIPE: "|", SEMI: ";", COLON: ":",
      MINUS: "-", EQUAL: "=", LEFT_BRACE: "[", RIGHT_BRACE: "]",
      LEFT_BRACKET: "{", RIGHT_BRACKET: "}", BACKSLASH: "\\"
    };
    const SHIFTED_LABELS = {
      N0: ")", N1: "!", N2: "@", N3: "#", N4: "$", N5: "%",
      N6: "^", N7: "&", N8: "*", N9: "(",
      NUMBER_1: "!", NUMBER_2: "@", MINUS: "_", EQUAL: "+"
    };
    const MOUSE_LABELS = {
      LCLK: "L CLICK", RCLK: "R CLICK", MCLK: "M CLICK",
      MB1: "L CLICK", MB2: "R CLICK", MB3: "M CLICK", MB4: "BACK", MB5: "FORWARD"
    };
    const keyboard = document.querySelector(".keyboard");
    const tabs = document.querySelector(".tabs");
    const title = document.querySelector("#title");
    const status = document.querySelector("#status");
    const settingsStatus = document.querySelector("#settings-status");
    const settingsGrid = document.querySelector(".settings-grid");
    const themeToggle = document.querySelector(".theme-toggle");
    const copyToast = document.querySelector(".copy-toast");
    let layers = [];
    let copyToastTimer;

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const dark = theme === "dark";
      themeToggle.textContent = dark ? "☀︎" : "☾";
      themeToggle.setAttribute("aria-label", `${dark ? "ライト" : "ダーク"}モードに切り替え`);
      localStorage.setItem("keymap-preview-theme", theme);
    }

    function initializeTheme() {
      const saved = localStorage.getItem("keymap-preview-theme");
      const preferred = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      setTheme(saved === "dark" || saved === "light" ? saved : preferred);
      themeToggle.addEventListener("click", () => {
        setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      });
    }

    function keycodeLabel(keycode) {
      const shifted = keycode.match(/^LS\((.+)\)$/);
      if (shifted) return SHIFTED_LABELS[shifted[1]] ?? `⇧ ${keycodeLabel(shifted[1])}`;
      if (/^(?:N|NUMBER_)\d$/.test(keycode)) return keycode.at(-1);
      return KEY_LABELS[keycode] ?? keycode;
    }

    function keyFromAction(action) {
      const [behavior, ...params] = action.split(/\s+/);
      let label = action;
      let extra = "";

      if (behavior === "&trans") return { label: "▽", action, extra: "transparent" };
      if (behavior === "&none") return { label: "—", action, extra: "small" };
      if (behavior === "&kp") label = keycodeLabel(params[0]);
      if (behavior === "&lt") {
        label = `${params[0]} ${keycodeLabel(params[1])}`;
        extra = "layer-key";
      }
      if (behavior === "&mo") {
        label = `SCROLL ${params[0]}`;
        extra = "layer-key";
      }
      if (behavior === "&mt") {
        label = `${keycodeLabel(params[0])} ${keycodeLabel(params[1])}`;
        extra = "layer-key";
      }
      if (behavior === "&mkp") label = MOUSE_LABELS[params[0]] ?? params[0];
      if (behavior === "&out") label = params[0]?.replace("OUT_", "") ?? action;
      if (behavior === "&bt") label = params[0] === "BT_NXT" ? "BT NEXT" : params.join(" ");
      if (label.length > 7) extra = `${extra} small`.trim();

      return { label, action, extra };
    }

    function parseBindings(source) {
      const cleaned = source
        .replace(/\/\*[\s\S]*?\*\//g, "")
        .replace(/\/\/.*$/gm, "");
      const starts = [...cleaned.matchAll(/&[A-Za-z0-9_]+/g)].map((match) => match.index);
      return starts.map((start, index) => {
        const end = starts[index + 1] ?? cleaned.length;
        return cleaned.slice(start, end).trim().replace(/\s+/g, " ");
      });
    }

    function rowsFromBindings(bindings, layerName) {
      const expectedCount = ROW_LENGTHS.reduce((total, length) => total + length, 0);
      if (bindings.length !== expectedCount) {
        throw new Error(`${layerName}: bindingsは${expectedCount}個必要ですが、${bindings.length}個あります`);
      }

      let offset = 0;
      return ROW_LENGTHS.map((length, rowIndex) => {
        const row = bindings.slice(offset, offset + length).map(keyFromAction);
        offset += length;
        return rowIndex === 3 ? [...row.slice(0, 9), null, null, ...row.slice(9)] : row;
      });
    }

    function parseKeymap(source) {
      const parsedLayers = [];
      const layerPattern = /\b(layer_[A-Za-z0-9_]+)\s*\{[\s\S]*?bindings\s*=\s*<([\s\S]*?)>;[\s\S]*?\};/g;
      for (const match of source.matchAll(layerPattern)) {
        parsedLayers.push({
          name: match[1],
          rows: rowsFromBindings(parseBindings(match[2]), match[1])
        });
      }
      if (parsedLayers.length === 0) throw new Error("レイヤー設定が見つかりません");
      return parsedLayers;
    }

    function capture(source, pattern, fallback = "—") {
      return source.match(pattern)?.[1]?.trim().replace(/\s+/g, " ") ?? fallback;
    }

    function transformLabel(value) {
      const flags = [...value.matchAll(/INPUT_TRANSFORM_([A-Z_]+)/g)].map((match) => match[1]);
      return flags.length ? flags.join(" + ") : "なし";
    }

    function parsePointingSettings(files) {
      const listener = capture(files.shield, /&pointing_listener\s*\{([\s\S]*?)\n\s*scroll_mode\s*\{/);
      const scroll = capture(files.shield, /scroll_mode\s*\{([\s\S]*?)\n\s*\};/);
      const tempLayer = files.shield.match(/&zip_temp_layer\s+(\d+)\s+(\d+)/);
      const snippets = capture(files.build, /shield:\s*torabo_tsuki_lp_right[\s\S]*?snippet:\s*["']?([^"'\n]+)/);
      const compatible = capture(files.device, /pointing_device[^\{]*\{[\s\S]*?compatible\s*=\s*"([^"]+)"/);
      const frequency = capture(files.device, /spi-max-frequency\s*=\s*<(\d+)>/);
      const idle = capture(files.shield, /require-prior-idle-ms\s*=\s*<(\d+)>/);
      const exclusions = capture(files.shield, /excluded-positions\s*=\s*<([^>]+)>/);
      const scrollLayers = capture(scroll, /layers\s*=\s*<([^>]+)>/);

      return [
        ["ビルド", `right / central`],
        ["入力デバイス", compatible],
        ["ドライバー", capture(files.driver, /CONFIG_([A-Z0-9_]+)=y/)],
        ["SPI 周波数", frequency === "—" ? frequency : `${Number(frequency).toLocaleString()} Hz`],
        ["通常時の軸変換", transformLabel(listener)],
        ["一時マウスレイヤー", tempLayer ? `layer ${tempLayer[1]} / ${tempLayer[2]} ms` : "なし"],
        ["スクロールレイヤー", scrollLayers],
        ["スクロール時の軸変換", transformLabel(scroll)],
        ["XY → スクロール", scroll.includes("zip_xy_to_scroll_mapper") ? "有効" : "無効"],
        ["一時レイヤー待機時間", idle === "—" ? idle : `${idle} ms`],
        ["一時レイヤー除外位置", exclusions],
        ["使用 snippet", snippets]
      ];
    }

    function renderPointingSettings(settings) {
      settingsGrid.replaceChildren(...settings.map(([name, value]) => {
        const item = document.createElement("div");
        item.className = "setting";
        const term = document.createElement("dt");
        term.textContent = name;
        const detail = document.createElement("dd");
        detail.textContent = value;
        item.append(term, detail);
        return item;
      }));
    }

    async function loadText(url) {
      const response = await fetch(url, { cache: "no-cache" });
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      return response.text();
    }

    async function initializePointingSettings() {
      try {
        const entries = await Promise.all(Object.entries(POINTING_CONFIG_URLS).map(async ([name, url]) => [name, await loadText(url)]));
        renderPointingSettings(parsePointingSettings(Object.fromEntries(entries)));
        settingsStatus.textContent = Object.values(POINTING_CONFIG_URLS).join(" · ");
      } catch (error) {
        settingsStatus.textContent = `読み込みエラー: ${error.message}`;
        console.error(error);
      }
    }

    async function copyCoordinate(layerName, rowIndex, colIndex) {
      const text = layerName + " r" + rowIndex + " c" + colIndex;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.append(textarea);
          textarea.select();
          const copied = document.execCommand("copy");
          textarea.remove();
          if (!copied) throw new Error("copy command failed");
        }
        copyToast.textContent = text + " をコピーしました";
      } catch (error) {
        copyToast.textContent = "コピーできませんでした";
        console.error(error);
      }
      copyToast.classList.add("visible");
      clearTimeout(copyToastTimer);
      copyToastTimer = setTimeout(() => copyToast.classList.remove("visible"), 1800);
    }

    function render(layerIndex) {
      title.textContent = layers[layerIndex].name;
      keyboard.replaceChildren();

      const axisRow = document.createElement("div");
      axisRow.className = "axis-row";
      const corner = document.createElement("div");
      corner.className = "axis-corner";
      const columnHeaders = document.createElement("div");
      columnHeaders.className = "row column-headers";
      Array.from({ length: 14 }, (_, colIndex) => {
        const label = document.createElement("div");
        label.className = "col-label";
        if (colIndex === 7) label.classList.add("split");
        label.textContent = `c${colIndex}`;
        columnHeaders.append(label);
      });
      axisRow.append(corner, columnHeaders);
      keyboard.append(axisRow);

      layers[layerIndex].rows.forEach((keys, rowIndex) => {
        const rowShell = document.createElement("div");
        rowShell.className = "row-shell";
        const rowLabel = document.createElement("div");
        rowLabel.className = "row-label";
        rowLabel.textContent = `r${rowIndex}`;
        const row = document.createElement("div");
        const short = keys.length === 12;
        row.className = `row${short ? " short" : ""}`;

        keys.forEach((key, index) => {
          const colIndex = short && index >= 6 ? index + 2 : index;
          const coord = `r${rowIndex} c${colIndex}`;
          if (key === null) {
            const hole = document.createElement("div");
            hole.className = "key-hole";
            hole.setAttribute("aria-label", `${coord} キー未実装`);
            row.append(hole);
            return;
          }
          const keyEl = document.createElement("div");
          const splitAt = keys.length / 2;
          keyEl.className = `key ${key.extra}`.trim();
          if (index === splitAt) keyEl.classList.add("split");
          keyEl.title = coord + " · " + key.action;
          keyEl.tabIndex = 0;
          keyEl.setAttribute("role", "button");
          keyEl.setAttribute("aria-label", layers[layerIndex].name + " " + coord + " " + key.action + "。クリックで座標をコピー");
          const copy = () => copyCoordinate(layers[layerIndex].name, rowIndex, colIndex);
          keyEl.addEventListener("click", copy);
          keyEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              copy();
            }
          });
          const action = document.createElement("span");
          action.className = "action";
          action.textContent = key.action;
          const label = document.createElement("span");
          label.className = `label${key.extra.includes("small") ? " small" : ""}`;
          label.textContent = key.label;
          keyEl.append(action, label);
          row.append(keyEl);
        });
        rowShell.append(rowLabel, row);
        keyboard.append(rowShell);
      });

      [...tabs.children].forEach((tab, index) => tab.setAttribute("aria-selected", String(index === layerIndex)));
    }

    async function initialize() {
      try {
        layers = parseKeymap(await loadText(KEYMAP_URL));
        status.textContent = `torabo-tsuki LP · M Layout · ${layers.length} layers · ${KEYMAP_URL}`;

        layers.forEach((layer, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = layer.name;
          button.addEventListener("click", () => render(index));
          tabs.append(button);
        });
        render(0);
      } catch (error) {
        title.textContent = "読み込みエラー";
        status.textContent = error.message;
        keyboard.textContent = `${KEYMAP_URL} を読み込めませんでした。HTTPサーバー経由で開いてください。`;
        console.error(error);
      }
    }

    initializeTheme();
    initialize();
    initializePointingSettings();
  </script>
</body>
</html>
